<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌾 HayDay - Cruel vs Dráculas</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <header>
      <!-- Logo superior usando tu nueva imagen logo2.png -->
      <img src="logo2.png" alt="Logo Vecindarios" class="main-logo">
      <p>🌾 Almacén Comunitario: Crueles & Dráculas 🚜</p>
    </header>

    <section class="card controls-panel">
      <div class="form-group">
        <label for="playerName">🧑‍🌾 Tu nombre en el juego:</label>
        <input type="text" id="playerName" placeholder="Ej. Alex" required>
      </div>

      <div class="form-group">
        <label for="neighborhood">🏡 Vecindario:</label>
        <select id="neighborhood">
          <option value="Crueles">Crueles</option>
          <option value="Dráculas">Dráculas</option>
        </select>
      </div>

      <div class="stock-badge" style="display:flex; flex-direction:column; gap:4px;">
        <div>🌾 Cupo disponible del vecindario: <strong id="neighborhoodLimitBadge">Cargando...</strong></div>
        <small style="color:#555;">(Límite: 1,500 productos en total por vecindario)</small>
      </div>

      <div class="stock-badge" style="background:#fff9db; color:#8d5b2d; border-color:#ffe066;">
        <span>📦 Productos en tu pedido:</span>
        <strong id="currentOrderCount">0 productos seleccionados</strong>
      </div>
    </section>

    <main>
      <div id="products" class="product-list">
        <p style="text-align:center; padding:15px; color:#fff; font-weight:bold;">Cargando catálogo...</p>
      </div>

      <div class="action-footer">
        <button id="submitOrder" type="button" class="btn-whatsapp">📲 Solicitar y Enviar por WhatsApp</button>
      </div>

      <div id="result" class="card result hidden"></div>
    </main>
  </div>

  <!-- Gallinita viajera -->
  <div id="roaming-chicken" class="roaming-chicken" style="top: 20%; left: 80%;">
    <div class="chicken-bubble" id="chicken-bubble">👀 ¡Pío!</div>
    <img src="gallina.png" alt="Gallina" class="chicken-avatar" id="chicken-img">
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
