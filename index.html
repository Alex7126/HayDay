<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌾 HayDay - Cruel vs Dráculas</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <header>
      <img src="logo2.png" alt="Logo Vecindarios" class="main-logo">
      <p>🌾 Almacén Comunitario: Crueles & Dráculas 🚜</p>
    </header>

    <section class="card controls-panel">
      <div class="form-group">
        <label for="playerName">🧑‍🌾 Tu nombre en el juego:</label>
        <input type="text" id="playerName" placeholder="Ej. Alex" required>
      </div>

      <div class="form-group">
        <label for="neighborhood">🏡 Vecindario:</label>
        <select id="neighborhood">
          <option value="Crueles">Crueles</option>
          <option value="Dráculas">Dráculas</option>
        </select>
      </div>

      <div class="stock-badge" style="display:flex; flex-direction:column; gap:4px;">
        <div>🌾 Cupo disponible del vecindario: <strong id="neighborhoodLimitBadge">Cargando...</strong></div>
        <small style="color:#555;">(Límite: 1,500 productos en total por vecindario)</small>
      </div>

      <div class="stock-badge" style="background:#fff9db; color:#8d5b2d; border-color:#ffe066;">
        <span>📦 Productos en tu pedido:</span>
        <strong id="currentOrderCount">0 productos seleccionados</strong>
      </div>
    </section>

    <main>
      <div id="products" class="product-list">
        <p style="text-align:center; padding:15px; color:#fff; font-weight:bold;">Cargando catálogo...</p>
      </div>

      <div class="action-footer">
        <button id="submitOrder" type="button" class="btn-whatsapp">📲 Solicitar y Enviar por WhatsApp</button>
      </div>

      <div id="result" class="card result hidden"></div>
    </main>
  </div>

  <!-- Gallinita tierna en SVG (100% transparente sin fondo blanco) -->
  <div id="roaming-chicken" class="roaming-chicken" style="top: 20%; left: 75%;">
    <div class="chicken-bubble" id="chicken-bubble">👀 ¡Pío!</div>
    <div class="chicken-avatar" id="chicken-img">
      <svg viewBox="0 0 100 100" width="100%" height="100%">
        <!-- Sombras y cuerpo suave -->
        <ellipse cx="50" cy="60" rx="36" ry="32" fill="#FFFFFF" stroke="#E2D9C8" stroke-width="2"/>
        <path d="M 42 28 C 42 16, 50 16, 50 28 C 50 14, 58 14, 58 28" fill="#E74C3C"/>
        <!-- Mejillas sonrojadas -->
        <circle cx="26" cy="62" r="7" fill="#FFAAA6" opacity="0.8"/>
        <circle cx="74" cy="62" r="7" fill="#FFAAA6" opacity="0.8"/>
        <!-- Ojos con brillo tierno -->
        <ellipse cx="36" cy="50" rx="6" ry="8" fill="#2C3E50"/>
        <circle cx="34" cy="47" r="2.5" fill="#FFFFFF"/>
        <ellipse cx="64" cy="50" rx="6" ry="8" fill="#2C3E50"/>
        <circle cx="62" cy="47" r="2.5" fill="#FFFFFF"/>
        <!-- Pico -->
        <polygon points="44,56 56,56 50,67" fill="#F39C12"/>
        <!-- Patitas -->
        <ellipse cx="38" cy="90" rx="8" ry="4" fill="#F39C12"/>
        <ellipse cx="62" cy="90" rx="8" ry="4" fill="#F39C12"/>
      </svg>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
