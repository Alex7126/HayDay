<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HayDay - Tienda Comunitaria</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>🌾 Almacén HayDay 🚜</h1>
      <p>Solicita los materiales y productos para tu granja</p>
    </header>

    <section class="controls-panel">
      <div class="form-group">
        <label for="player-name">Tu nombre en el juego:</label>
        <input type="text" id="player-name" placeholder="Ej. Alex Granja" required>
      </div>

      <div class="form-group">
        <label for="neighborhood-select">Tu Vecindario:</label>
        <select id="neighborhood-select">
          <option value="Crueles">Crueles</option>
          <option value="Dráculas">Dráculas</option>
        </select>
      </div>
    </section>

    <main>
      <h2>Productos Disponibles</h2>
      <br>
      <div id="product-grid" class="product-grid">
        <!-- Se llena automáticamente con app.js -->
      </div>

      <section class="order-summary">
        <h2>📋 Tu Solicitud</h2>
        <ul id="order-list" class="order-list">
          <li>No has agregado productos todavía.</li>
        </ul>
        <button id="btn-submit" class="btn-whatsapp">📲 Enviar Pedido por WhatsApp</button>
      </section>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
