<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌾 HayDay - Almacén Comunitario</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>🌾 Almacén HayDay 🚜</h1>
      <p>Pide materiales para tu vecindario</p>
    </header>

    <section class="card controls-panel">
      <div class="form-group">
        <label for="playerName">Tu nombre en el juego:</label>
        <input type="text" id="playerName" placeholder="Ej. Alex" required>
      </div>

      <div class="form-group">
        <label for="neighborhood">Vecindario:</label>
        <select id="neighborhood">
          <option value="Crueles">Crueles</option>
          <option value="Dráculas">Dráculas</option>
        </select>
      </div>

      <!-- Indicadores de cupo disponible -->
      <div class="stock-badge" style="display:flex; flex-direction:column; gap:4px;">
        <div>Cupo restante del vecindario: <strong id="neighborhoodLimitBadge">Cargando...</strong></div>
        <small style="color:#555;">(Límite máximo: 1,500 productos por vecindario)</small>
      </div>

      <div class="stock-badge" style="background:#eef2f7; color:#2c3e50;">
        <span>Ítems en este pedido:</span>
        <strong id="currentOrderCount">0 productos</strong>
      </div>
    </section>

    <main>
      <div id="products" class="product-list">
        <p>Cargando productos desde la base de datos...</p>
      </div>

      <div class="action-footer">
        <button id="submitOrder" type="button" class="btn-whatsapp">📲 Solicitar y Enviar por WhatsApp</button>
      </div>

      <div id="result" class="card result hidden"></div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
